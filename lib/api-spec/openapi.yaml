openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: money
    description: Personal finance calculations
  - name: imports
    description: Read-only account and document imports for the financial plan
  - name: profile
    description: Household profile inputs for the financial plan
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: agent
    description: Read-only Hermes chat path grounded in existing financial data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /money-calendar:
    get:
      operationId: getMoneyCalendar
      tags: [money]
      summary: Get the money timeline and safe-to-spend forecast
      description: Returns the structured financial picture used by the calendar and safe-to-spend calculation.
      responses:
        "200":
          description: Seeded money calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyCalendar"
  /profile:
    get:
      operationId: getFinancialProfile
      tags: [profile]
      summary: Get the saved household profile
      responses:
        "200":
          description: Saved household profile, or null when setup is incomplete
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FinancialProfile"
                  - type: "null"
    put:
      operationId: saveFinancialProfile
      tags: [profile]
      summary: Validate and save the household profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialProfileInput"
      responses:
        "200":
          description: Saved household profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialProfile"
  /imports:
    get:
      operationId: listImports
      tags: [imports]
      summary: List imported records and sources awaiting review
      responses:
        "200":
          description: Import review queue and source state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReviewQueue"
  /imports/account-connections:
    post:
      operationId: startAccountConnection
      tags: [imports]
      summary: Start a read-only account connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountConnectionInput"
      responses:
        "201":
          description: Read-only connection started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConnection"
  /imports/documents:
    post:
      operationId: createDocumentImport
      tags: [imports]
      summary: Register a supported document for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentImportInput"
      responses:
        "201":
          description: Document import created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedRecord"
  /imports/{id}/review:
    post:
      operationId: reviewImportedRecord
      tags: [imports]
      summary: Accept or reject an imported record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportReviewInput"
      responses:
        "200":
          description: Reviewed imported record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedRecord"
  /imports/{id}:
    delete:
      operationId: deleteImportedRecord
      tags: [imports]
      summary: Delete an imported record and its financial effect
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Import deleted
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: The client sends metadata here, then uploads the file directly to private object storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /affordability:
    post:
      operationId: checkAffordability
      tags: [money]
      summary: Check a loan against legal, calendar, and resilience rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffordabilityInput"
      responses:
        "200":
          description: Affordability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffordabilityResult"
  /rent-vs-buy:
    post:
      operationId: compareRentVsBuy
      tags: [money]
      summary: Compare renting with buying a home
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentVsBuyInput"
      responses:
        "200":
          description: Rent versus buy result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentVsBuyResult"
  /stress:
    post:
      operationId: runStressTest
      tags: [money]
      summary: Run a no-income and rate stress test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StressInput"
      responses:
        "200":
          description: Stress test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StressResult"
  /agent/chat:
    post:
      operationId: postAgentChat
      tags: [agent]
      summary: Read-only Hermes chat turn grounded in existing financial data
      description: Builds compact server-side financial context and sends it plus a bounded recent-message window to the isolated uae-finance Hermes profile. Hermes explains or proposes only; it never mutates state in this block.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatRequest"
      responses:
        "200":
          description: Structured agent turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentChatResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Income:
      type: object
      required: [basic, housingAllowance, variable]
      properties:
        basic: { type: number }
        housingAllowance: { type: number }
        variable: { type: number }
    CalendarEvent:
      type: object
      required: [id, label, amount, day, kind, paymentType, status, confidence, amountType, accountName, reviewed, source, freshness]
      properties:
        id: { type: string }
        label: { type: string }
        amount: { type: number }
        day: { type: integer }
        kind:
          type: string
          enum: [income, fixed, lump, goal]
        paymentType:
          type: string
          enum: [salary, rent, loan, school, credit-card, insurance, goal]
        status:
          type: string
          enum: [actual, forecasted, pending, overdue]
        confidence:
          type: string
          enum: [high, medium, low]
        amountType:
          type: string
          enum: [fixed, variable, range]
        accountName: { type: string }
        reviewed: { type: boolean }
        source: { type: string }
        freshness: { type: string, format: date-time }
        balanceAfter: { type: ["number", "null"] }
        note: { type: ["string", "null"] }
    SafeToSpendScenario:
      type: object
      required: [spendAmount, safeToSpendAfter]
      properties:
        spendAmount: { type: number }
        safeToSpendAfter: { type: number }
    FinancialSnapshot:
      type: object
      required: [asOf, currency, currentAvailableBalance, expectedIncomeBeforeNextPayday, billsAndCommitmentsDueBeforeNextPayday, minimumDebtPayments, plannedGoalContributions, recommendedEmergencyBuffer, safeToSpendUntilPayday, safeToSpendThisMonth, scenarios]
      properties:
        asOf: { type: string, format: date }
        currency: { type: string, enum: [AED] }
        currentAvailableBalance: { type: number }
        expectedIncomeBeforeNextPayday: { type: number }
        billsAndCommitmentsDueBeforeNextPayday: { type: number }
        minimumDebtPayments: { type: number }
        plannedGoalContributions: { type: number }
        recommendedEmergencyBuffer: { type: number }
        safeToSpendUntilPayday: { type: number }
        safeToSpendThisMonth: { type: number }
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/SafeToSpendScenario" }
    MoneyCalendar:
      type: object
      required: [persona, month, monthLabel, safeToSpend, projectedPayday, tightDay, bufferTarget, financialSnapshot, events, assumptions]
      properties:
        persona: { type: string }
        month: { type: string }
        monthLabel: { type: string }
        safeToSpend: { type: number }
        projectedPayday: { type: number }
        tightDay: { type: integer }
        bufferTarget: { type: number }
        financialSnapshot:
          $ref: "#/components/schemas/FinancialSnapshot"
        income:
          $ref: "#/components/schemas/Income"
        events:
          type: array
          items: { $ref: "#/components/schemas/CalendarEvent" }
        assumptions:
          type: array
          items: { type: string }
    ProfileCommitmentInput:
      type: object
      required: [name, amount, day, category, confidence]
      properties:
        name: { type: string, minLength: 1 }
        amount: { type: number, minimum: 0 }
        day: { type: integer, minimum: 1, maximum: 31 }
        category: { type: string, minLength: 1 }
        confidence:
          type: string
          enum: [high, medium, low]
    ProfileGoalInput:
      type: object
      required: [name, target, date, priority]
      properties:
        name: { type: string, minLength: 1 }
        target: { type: number, minimum: 0 }
        date:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
        priority:
          type: string
          enum: [high, medium, low]
        confidence:
          type: string
          enum: [high, medium, low]
    FinancialProfileInput:
      type: object
      required: [country, emirate, residency, employment, householdType, adults, dependents, basicSalary, housingAllowance, variableIncome, payFrequency, payday, availableBalance, mainAccount, commitments, goals, bufferPreference, bufferAmount]
      properties:
        country: { type: string, minLength: 1 }
        emirate: { type: string, minLength: 1 }
        residency: { type: string, minLength: 1 }
        employment: { type: string, minLength: 1 }
        householdType: { type: string, minLength: 1 }
        adults: { type: integer, minimum: 1 }
        dependents: { type: integer, minimum: 0 }
        basicSalary: { type: number, exclusiveMinimum: 0 }
        housingAllowance: { type: number, minimum: 0 }
        variableIncome: { type: number, minimum: 0 }
        payFrequency: { type: string, minLength: 1 }
        payday: { type: integer, minimum: 1, maximum: 31 }
        availableBalance: { type: number, minimum: 0 }
        mainAccount: { type: string, minLength: 1 }
        commitments:
          type: array
          items: { $ref: "#/components/schemas/ProfileCommitmentInput" }
        goals:
          type: array
          items: { $ref: "#/components/schemas/ProfileGoalInput" }
        bufferPreference:
          type: string
          enum: [recommended, custom]
        bufferAmount: { type: number, minimum: 0 }
    ProfileCommitment:
      allOf:
        - $ref: "#/components/schemas/ProfileCommitmentInput"
        - type: object
          required: [source, reviewed, freshness]
          properties:
            source: { type: string }
            reviewed: { type: boolean }
            freshness: { type: string, format: date-time }
    ProfileGoal:
      allOf:
        - $ref: "#/components/schemas/ProfileGoalInput"
        - type: object
          required: [confidence, source, reviewed, freshness]
          properties:
            confidence:
              type: string
              enum: [high, medium, low]
            source: { type: string }
            reviewed: { type: boolean }
            freshness: { type: string, format: date-time }
    FinancialProfile:
      allOf:
        - $ref: "#/components/schemas/FinancialProfileInput"
        - type: object
          required: [id, confidence, source, reviewed, freshness, commitments, goals]
          properties:
            id: { type: string }
            confidence:
              type: string
              enum: [high, medium, low]
            source: { type: string }
            reviewed: { type: boolean }
            freshness: { type: string, format: date-time }
            commitments:
              type: array
              items: { $ref: "#/components/schemas/ProfileCommitment" }
            goals:
              type: array
              items: { $ref: "#/components/schemas/ProfileGoal" }
    ImportSource:
      type: object
      required: [type, name, freshness, retention, deletionState]
      properties:
        type:
          type: string
          enum: [account, bank-statement, payslip, credit-card-statement, tenancy-contract, school-fee-schedule]
        name: { type: string }
        freshness: { type: string, format: date-time }
        retention: { type: string }
        deletionState:
          type: string
          enum: [active, deletion-requested, deleted]
        objectPath: { type: ["string", "null"] }
    ImportedRecord:
      type: object
      required: [id, source, event, reviewStatus, discoveredAt]
      properties:
        id: { type: string }
        source:
          $ref: "#/components/schemas/ImportSource"
        event:
          $ref: "#/components/schemas/CalendarEvent"
        reviewStatus:
          type: string
          enum: [needs-review, duplicate, accepted, rejected]
        duplicateOf: { type: ["string", "null"] }
        discoveredAt: { type: string, format: date-time }
    ImportReviewQueue:
      type: object
      required: [records, connections]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/ImportedRecord"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/AccountConnection"
    AccountConnectionInput:
      type: object
      required: [institution, accountName, accountType]
      properties:
        institution: { type: string, minLength: 1 }
        accountName: { type: string, minLength: 1 }
        accountType:
          type: string
          enum: [current, savings, credit-card]
    AccountConnection:
      type: object
      required: [id, institution, accountName, accountType, permission, status, connectedAt, lastSyncedAt]
      properties:
        id: { type: string }
        institution: { type: string }
        accountName: { type: string }
        accountType:
          type: string
          enum: [current, savings, credit-card]
        permission:
          type: string
          enum: [read-only]
        status:
          type: string
          enum: [pending, connected, disconnected]
        connectedAt: { type: string, format: date-time }
        lastSyncedAt: { type: ["string", "null"], format: date-time }
    DocumentImportInput:
      type: object
      required: [documentType, fileName, contentType, size, objectPath, label, amount, day, kind, paymentType, amountType, accountName]
      properties:
        documentType:
          type: string
          enum: [bank-statement, payslip, credit-card-statement, tenancy-contract, school-fee-schedule]
        fileName: { type: string, minLength: 1 }
        contentType: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        objectPath: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        amount: { type: number, minimum: 0 }
        day: { type: integer, minimum: 1, maximum: 31 }
        kind:
          type: string
          enum: [income, fixed, lump, goal]
        paymentType:
          type: string
          enum: [salary, rent, loan, school, credit-card, insurance, goal]
        amountType:
          type: string
          enum: [fixed, variable, range]
        accountName: { type: string, minLength: 1 }
        note: { type: string }
    ImportReviewInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accept, reject]
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    AffordabilityInput:
      type: object
      required: [amount, annualRate, tenureMonths, upfrontCash]
      properties:
        amount: { type: number, minimum: 0 }
        annualRate: { type: number, minimum: 0 }
        rateType:
          type: string
          enum: [flat, reducing]
          default: reducing
        tenureMonths: { type: integer, minimum: 1, maximum: 120 }
        upfrontCash: { type: number, minimum: 0 }
        financedFee: { type: boolean, default: false }
        processingFeePercentage: { type: number, minimum: 0, maximum: 100, default: 1 }
    AffordabilityResult:
      type: object
      required: [verdict, headline, monthlyInstallment, maxInstallment, reducingEquivalentRate, apr, legal, calendar, resilience, suggestions, assumptions]
      properties:
        verdict:
          type: string
          enum: [fits, fits-if, doesnt-fit]
        headline: { type: string }
        monthlyInstallment: { type: number }
        maxInstallment: { type: number }
        reducingEquivalentRate: { type: number }
        apr: { type: number }
        legal:
          type: object
          required: [passes, debtRatio, maxDebtRatio, salaryMultiple, maxSalaryMultiple, maxTermMonths]
          properties:
            passes: { type: boolean }
            debtRatio: { type: number }
            maxDebtRatio: { type: number }
            salaryMultiple: { type: number }
            maxSalaryMultiple: { type: number }
            maxTermMonths: { type: integer }
        calendar:
          type: object
          required: [passes, worstMonth, lowestBalance]
          properties:
            passes: { type: boolean }
            worstMonth: { type: string }
            lowestBalance: { type: number }
        resilience:
          type: object
          required: [bufferAfterUpfront, monthsSurvived, targetBuffer]
          properties:
            bufferAfterUpfront: { type: number }
            monthsSurvived: { type: number }
            targetBuffer: { type: number }
        suggestions:
          type: array
          items: { type: string }
        assumptions:
          type: array
          items: { type: string }
    RentVsBuyInput:
      type: object
      required: [monthlyRent, homePrice, savings, yearsToStay, annualIncome, existingInstallments, familyPlans]
      properties:
        monthlyRent: { type: number, minimum: 0 }
        homePrice: { type: number, minimum: 0 }
        savings: { type: number, minimum: 0 }
        yearsToStay: { type: integer, minimum: 1, maximum: 30 }
        annualIncome: { type: number, minimum: 0 }
        existingInstallments: { type: number, minimum: 0 }
        familyPlans: { type: string }
    RentVsBuyResult:
      type: object
      required: [verdict, headline, dayOneCash, monthlyOwning, monthlyRenting, breakEvenYear, scenarios, flipFactor, assumptions]
      properties:
        verdict:
          type: string
          enum: [rent-for-now, buy-if, buy]
        headline: { type: string }
        dayOneCash: { type: number }
        monthlyOwning: { type: number }
        monthlyRenting: { type: number }
        breakEvenYear: { type: number }
        flipFactor: { type: string }
        scenarios:
          type: array
          items:
            type: object
            required: [label, netPosition]
            properties:
              label: { type: string }
              netPosition: { type: number }
        assumptions:
          type: array
          items: { type: string }
    StressInput:
      type: object
      required: [monthlyIncome, monthlyCommitments, buffer, rateIncrease, priceDrop, noIncomeMonths]
      properties:
        monthlyIncome: { type: number }
        monthlyCommitments: { type: number }
        buffer: { type: number }
        rateIncrease: { type: number }
        priceDrop: { type: number }
        noIncomeMonths: { type: integer }
    StressResult:
      type: object
      required: [monthsSurvived, stressedMonthlyCommitment, endingBuffer, headline]
      properties:
        monthsSurvived: { type: number }
        stressedMonthlyCommitment: { type: number }
        endingBuffer: { type: number }
        headline: { type: string }
    AgentChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string, minLength: 1, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
    AgentChatRequest:
      type: object
      required: [messages]
      properties:
        conversationId: { type: string }
        messages:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/AgentChatMessage" }
    AgentProposedAction:
      type: object
      required: [summary]
      properties:
        summary: { type: string }
        details: { type: ["string", "null"] }
    AgentChatResponse:
      type: object
      required: [conversationId, outcome, message, missingQuestion, proposedAction]
      properties:
        conversationId: { type: string }
        outcome:
          type: string
          enum: [answer, needs_input, out_of_scope, proposed_action, error]
        message:
          $ref: "#/components/schemas/AgentChatMessage"
        missingQuestion: { type: ["string", "null"] }
        proposedAction:
          oneOf:
            - $ref: "#/components/schemas/AgentProposedAction"
            - type: "null"

